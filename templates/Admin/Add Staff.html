{% extends "Admin/index.html" %}
{% block body %}
<form action="/WMS/Add_staff_post/" method="post" enctype="multipart/form-data" name="form1" id="form1">
     {% csrf_token %}
    <div style="color: blue"><h3>Add Staff</h3></div>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <table width="300" border="1" class="table table-borderless ">

    <tr>
      <td width="70" style="background-color: #00a0dc;color: white" >Name</td>
      <td width="218">
        <input type="text" name="name" id="textfield" class="form-control" value="{{ form_data.name|default:'' }}" required=""/>
      </td>
    </tr>
    <tr >
      <td style="background-color: #00a0dc;color: white">DOB</td>
      <td><input type="date" name="dob" id="textfield14" class="form-control" value="{{ form_data.dob|default:'' }}" /></td>
    </tr>
    <tr>
      <td style="background-color: #00a0dc;color: white">Phone</td>
      <td><input type="tel" name="phone" id="textfield3" class="form-control" value="{{ form_data.phone|default:'' }}" required pattern="\+?[0-9 ()-]{8,20}" title="Enter a Qatar or international number with 8 to 15 digits"/></td>
    </tr>
    <tr>
      <td style="background-color: #00a0dc;color: white">Photo</td>
      <td><label>
        <input type="file" name="photo" id="fileField" class="form-control" />
      </label></td>
    </tr>
    <tr>
      <td style="background-color: #00a0dc;color: white">Email</td>
      <td><input type="email" name="email" id="textfield4" class="form-control" value="{{ form_data.email|default:'' }}" required=""/></td>
    </tr>
    <tr>
      <td style="background-color: #00a0dc;color: white">Place</td>
      <td><input type="text" name="place" id="textfield5" class="form-control" value="{{ form_data.place|default:'' }}"/></td>
    </tr>
    <tr>
      <td style="background-color: #00a0dc;color: white">Nation</td>
      <td><input type="text" name="nation" id="textfield7" class="form-control" value="{{ form_data.nation|default:'' }}"/></td>
    </tr>
    <tr>
      <td style="background-color: #00a0dc;color: white">Contact(Home)</td>
      <td><input type="tel" name="phone2" class="form-control" value="{{ form_data.phone2|default:'' }}" pattern="\+?[0-9 ()-]{8,20}" title="Enter 8 to 15 digits"/></td>
    </tr>
    <tr>
      <td style="background-color: #00a0dc;color: white" >Designation</td>
      <td ><label>
        <select name="designation" id="select" class="form-control" required>
          {% for role in designations %}<option value="{{ role }}" {% if form_data.designation == role %}selected{% endif %}>{{ role }}</option>{% endfor %}
        </select>
      </label></td>
    </tr>
    <tr align="center">
      <td colspan="2"><input type="submit" name="button" id="button" value="Add" class="btn btn-outline-primary"/></td>
    </tr>
  </table>
</form>
{% endblock %}
{#</body>#}
{#</html>#}
