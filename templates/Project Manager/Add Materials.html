{% extends "Project Manager/pmindex.html" %}
{% block body %}
<div class="card"><div class="card-body"><div class="d-flex justify-content-between align-items-center"><h5 class="card-title">Add Material Catalog List</h5><button type="button" id="addCatalogRow" class="btn btn-sm btn-outline-primary"><i class="bi bi-plus-lg"></i> Add Row</button></div>
<form method="post" action="{% url 'Add_material_post' %}">{% csrf_token %}
  <div class="row g-2 px-2 pb-2 d-none d-md-flex text-muted small fw-semibold"><div class="col-md-7">Material name</div><div class="col-md-4">Unit</div><div class="col-md-1"></div></div>
  <div id="catalogRows"><div class="bulk-row row g-2 align-items-end border rounded p-2 mb-2"><div class="col-md-7"><label class="form-label d-md-none">Material name</label><input name="name" class="form-control" required></div><div class="col-md-4"><label class="form-label d-md-none">Unit</label><select name="unit" class="form-select" required><option value="kg">Kilogram</option><option value="sack">Sack</option><option value="stm">Square metre</option><option value="gallon">Gallon</option><option value="sheet">Sheet</option><option value="packet">Packet</option><option value="drum">Drum</option><option value="bag">Bag</option><option value="roll">Roll</option><option value="no">No.</option></select></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger remove-row w-100" aria-label="Remove row"><i class="bi bi-trash"></i></button></div></div></div>
  <button class="btn btn-primary mt-3" type="submit">Save All Materials</button>
</form></div></div>
<script>
(function () {
  const rows = document.getElementById('catalogRows');
  document.getElementById('addCatalogRow').addEventListener('click', () => {
    const row = rows.querySelector('.bulk-row').cloneNode(true);
    row.querySelector('[name="name"]').value = ''; row.querySelector('[name="unit"]').value = 'kg'; rows.appendChild(row);
  });
  rows.addEventListener('click', (event) => {
    const button = event.target.closest('.remove-row'); if (!button) return;
    const allRows = rows.querySelectorAll('.bulk-row');
    if (allRows.length > 1) button.closest('.bulk-row').remove(); else button.closest('.bulk-row').querySelector('[name="name"]').value = '';
  });
})();
</script>
{% endblock %}
