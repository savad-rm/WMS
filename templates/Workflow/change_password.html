{% extends 'Workflow/base.html' %}
{% block body %}
<div class="pagetitle"><h1>Change Password</h1><nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="{% url 'workflow_dashboard' %}">Home</a></li><li class="breadcrumb-item active">Change Password</li></ol></nav></div>
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card"><div class="card-body"><h5 class="card-title">Update Your Password</h5>
      <form method="post" class="row g-3">{% csrf_token %}
        <div class="col-12"><label class="form-label">Current password</label><input type="password" name="current_password" class="form-control" autocomplete="current-password" required></div>
        <div class="col-md-6"><label class="form-label">New password</label><input type="password" name="new_password" class="form-control" minlength="8" autocomplete="new-password" required></div>
        <div class="col-md-6"><label class="form-label">Confirm new password</label><input type="password" name="confirm_password" class="form-control" minlength="8" autocomplete="new-password" required></div>
        <div class="col-12"><button class="btn btn-primary" type="submit">Change Password</button></div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
