{% extends 'Workflow/base.html' %}
{% block body %}
<div class="pagetitle"><h1>Quotation Preview</h1></div>
<div class="card"><div class="card-body">
  <h5 class="card-title text-danger">Preview could not be generated</h5>
  <div class="alert alert-danger mb-3"><i class="bi bi-exclamation-triangle me-1"></i>{{ preview_error }}</div>
  <p class="text-muted">Your quotation has not been saved or changed. Close this preview tab, correct the highlighted entry in the editor, and preview again.</p>
  <button type="button" class="btn btn-outline-secondary" onclick="window.close()"><i class="bi bi-x-lg"></i> Close Preview</button>
</div></div>
{% endblock %}
